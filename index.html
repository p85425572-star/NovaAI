<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaAI - Smart Hub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0a0a16, #1a0f3a, #4a0072);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            position: relative;
            overflow: hidden;
        }

        .bg-text {
            position: absolute;
            font-size: 10rem;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.02);
            z-index: 0;
            user-select: none;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            letter-spacing: 10px;
        }

        .app-container {
            width: 90%;
            max-width: 1200px;
            padding: 20px;
            z-index: 1;
            height: 90vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 35px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            width: 100%;
            max-width: 800px;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 34px;
            background: linear-gradient(to right, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .header p {
            font-size: 13px;
            color: #b3b9c1;
        }

        .input-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .main-input-row {
            display: flex;
            gap: 12px;
        }

        .main-input-row input {
            flex: 1;
            padding: 15px 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        .main-input-row input:focus {
            border-color: #00f2fe;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
        }

        .main-input-row button {
            padding: 15px 24px;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .main-input-row button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 242, 254, 0.4);
        }

        .actions-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #94a3b8;
            cursor: pointer;
        }

        .checkbox-label input[type="checkbox"] {
            appearance: none;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.3);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .checkbox-label input[type="checkbox"]:checked {
            background: #00f2fe;
            border-color: #00f2fe;
            box-shadow: 0 0 8px rgba(0, 242, 254, 0.5);
        }

        .checkbox-label input[type="checkbox"]:checked::after {
            content: '✓';
            color: #000;
            font-weight: bold;
            font-size: 10px;
        }

        .icon-buttons {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 10px;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
            transition: 0.2s;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #00f2fe;
        }

        .output-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 18px;
            font-size: 13px;
            color: #00f2fe;
            min-height: 80px;
            max-height: 150px;
            overflow-y: auto;
            line-height: 1.6;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="bg-text">NovaAI</div>

    <div class="app-container">
        <div class="glass-card">
            <div class="header">
                <h1>NovaAI</h1>
                <p>Next-Gen Secure Guardrails & Control Hub</p>
            </div>

            <div class="input-section">
                <div class="main-input-row">
                    <input type="text" id="userInput" placeholder="Ask me anything..." />
                    <button onclick="processAI()">Run NovaAI</button>
                </div>
                
                <div class="actions-row">
                    <label class="checkbox-label">
                        <input type="checkbox" checked> Active
                    </label>
                    
                    <div class="icon-buttons">
                        <button class="icon-btn" title="Add Profile">👤</button>
                        <button class="icon-btn" title="Create New">➕</button>
                    </div>
                </div>
            </div>

            <div class="output-box" id="outputBox">
                System Initialized. NovaAI is online, running securely.
            </div>
        </div>
    </div>

    <script>
        function processAI() {
            const inputVal = document.getElementById("userInput").value.trim();
            const outputBox = document.getElementById("outputBox");
            
            if (inputVal === "") {
                outputBox.innerHTML = "<span style='color: #ff4757;'>Please enter a query to process!</span>";
                return;
            }

            let response = "";
            const lowerInput = inputVal.toLowerCase();

            if (lowerInput.includes("hello") || lowerInput.includes("hi")) {
                response = "Hello! I am NovaAI, your secure digital assistant. How can I help you today?";
            } else if (lowerInput.includes("who are you")) {
                response = "I am NovaAI, a Next-Gen Secure Guardrails & Control Hub. I operate locally on your device.";
            } else if (lowerInput.includes("how are you")) {
                response = "I am functioning perfectly within optimal security parameters.";
            } else if (lowerInput.includes("code") || lowerInput.includes("generate")) {
                response = "As a generative AI, I can generate code, draft content, and create various digital assets based on your specifications.";
            } else {
                response = `Processing "${inputVal}"... I can assist by generating comprehensive solutions, code, and content tailored to your needs.`;
            }

            outputBox.innerHTML = `NovaAI: <br><br> <span>${response}</span>`;
            document.getElementById("userInput").value = "";
        }
    </script>

</body>
</html>
