<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaAI - Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #090a10;
            min-height: 100vh;
            display: flex;
            color: #fff;
            overflow: hidden;
        }

        /* Sidebar Navigation */
        .sidebar {
            width: 260px;
            background: #11131b;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            border-right: 1px solid #1c202e;
        }

        .sidebar h2 {
            font-size: 24px;
            color: #00f2fe;
            margin-bottom: 20px;
        }

        .menu-item {
            padding: 12px 16px;
            background: #1a1e29;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-item:hover, .menu-item.active {
            background: #00f2fe;
            color: #090a10;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
        }

        /* Main Content Area */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: relative;
        }

        /* Top Navigation Bar */
        .top-bar {
            background: #11131b;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1c202e;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .profile-icon {
            width: 40px;
            height: 40px;
            background: #1a1e29;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid #00f2fe;
        }

        /* Dashboard View */
        .content-area {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 30px;
            max-height: calc(100vh - 150px);
        }

        .output-box {
            background: #11131b;
            border: 1px solid #1c202e;
            border-radius: 20px;
            padding: 30px;
            font-size: 16px;
            color: #e2e8f0;
            flex: 1;
            overflow-y: auto;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            padding: 15px;
            border-radius: 16px;
            max-width: 80%;
        }

        .user-message {
            background: rgba(0, 242, 254, 0.1);
            align-self: flex-end;
            border: 1px solid rgba(0, 242, 254, 0.2);
            color: #fff;
        }

        .ai-message {
            background: #1a1e29;
            align-self: flex-start;
            border: 1px solid #282f42;
            color: #00f2fe;
        }

        /* Input Section */
        .input-section {
            background: #11131b;
            padding: 20px 30px;
            border-top: 1px solid #1c202e;
            width: 100%;
            position: absolute;
            bottom: 0;
            left: 0;
        }

        .main-input-row {
            display: flex;
            gap: 15px;
        }

        .main-input-row input {
            flex: 1;
            padding: 20px;
            background: #1a1e29;
            border: 1px solid #282f42;
            border-radius: 16px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        .main-input-row input:focus {
            border-color: #00f2fe;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
        }

        .icon-btn {
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            border: none;
            border-radius: 16px;
            color: #090a10;
            width: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            transition: 0.3s;
        }

        .icon-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 242, 254, 0.4);
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>NovaAI</h2>
        <div class="menu-item active">Dashboard</div>
        <div class="menu-item">Create New Video</div>
        <div class="menu-item">Recent Activity</div>
        <div class="menu-item">Account</div>
    </div>

    <div class="main-content">
        <div class="top-bar">
            <div>Dashboard</div>
            <div class="user-info">
                <span>User Profile</span>
                <div class="profile-icon">👤</div>
            </div>
        </div>

        <div class="content-area">
            <div class="output-box" id="outputBox"></div>
        </div>

        <div class="input-section">
            <div class="main-input-row">
                <input type="text" id="userInput" placeholder="Ask anything..." onkeypress="handleKey(event)" />
                <button class="icon-btn" onclick="processAI()">➔</button>
            </div>
        </div>
    </div>

    <script>
        function handleKey(event) {
            if (event.key === 'Enter') processAI();
        }

        function processAI() {
            const inputVal = document.getElementById("userInput").value.trim();
            const outputBox = document.getElementById("outputBox");
            
            if (inputVal === "") return;

            const userMsgDiv = document.createElement("div");
            userMsgDiv.className = "message user-message";
            userMsgDiv.innerText = inputVal;
            outputBox.appendChild(userMsgDiv);

            document.getElementById("userInput").value = "";
            outputBox.scrollTop = outputBox.scrollHeight;

            setTimeout(() => {
                let response = "";
                const lowerInput = inputVal.toLowerCase();

                if (lowerInput.includes("what is ai") || lowerInput.includes("artificial intelligence")) {
                    response = "Artificial Intelligence (AI) refers to the simulation of human intelligence in machines programmed to think and learn like humans. It involves tasks like problem-solving, reasoning, and learning.";
                } else if (lowerInput.includes("code") || lowerInput.includes("generate")) {
                    response = "As a generative AI, I can generate code, draft content, and create various digital assets based on your specifications.";
                } else {
                    response = "I can assist by generating comprehensive solutions, code, and content tailored to your needs.";
                }

                const aiMsgDiv = document.createElement("div");
                aiMsgDiv.className = "message ai-message";
                aiMsgDiv.innerText = response;
                outputBox.appendChild(aiMsgDiv);

                outputBox.scrollTop = outputBox.scrollHeight;
            }, 500);
        }
    </script>
</body>
</html>
