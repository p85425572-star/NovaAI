<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaAI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #090a10;
            min-height: 100vh;
            display: flex;
            color: #fff;
            overflow: hidden;
        }

        /* Login Screen */
        .login-screen {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-card {
            background: #11131b;
            padding: 40px;
            border-radius: 20px;
            border: 1px solid #1c202e;
            width: 400px;
            max-width: 90%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .login-card h2 {
            color: #00f2fe;
            text-align: center;
        }

        .login-card input {
            padding: 15px;
            background: #1a1e29;
            border: 1px solid #282f42;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        .login-card input:focus {
            border-color: #00f2fe;
        }

        .login-btn {
            padding: 15px;
            background: #00f2fe;
            border: none;
            border-radius: 12px;
            color: #090a10;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
        }

        /* Main Content Area */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: relative;
            display: none; /* Hidden by default */
        }

        /* Top Navigation Bar */
        .top-bar {
            background: #11131b;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1c202e;
        }

        .new-chat-btn {
            background: #1a1e29;
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid #00f2fe;
            color: #00f2fe;
            font-weight: bold;
        }

        .new-chat-btn:hover {
            background: #00f2fe;
            color: #090a10;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .profile-icon {
            width: 40px;
            height: 40px;
            background: #1a1e29;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid #00f2fe;
        }

        /* Modal for Recent Activity & Profile */
        .modal {
            display: none;
            position: fixed;
            z-index: 10;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(9, 10, 16, 0.849);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #11131b;
            border: 1px solid #1c202e;
            border-radius: 20px;
            padding: 40px;
            width: 500px;
            max-width: 90%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 24px;
            cursor: pointer;
            color: #00f2fe;
        }

        .modal-content h3 {
            color: #00f2fe;
            font-size: 22px;
        }

        .activity-list {
            list-style: none;
            max-height: 200px;
            overflow-y: auto;
            color: #a0aec0;
            font-size: 14px;
        }

        .activity-list li {
            padding: 10px 0;
            border-bottom: 1px solid #1c202e;
        }

        .profile-actions {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .profile-actions input {
            padding: 15px;
            background: #1a1e29;
            border: 1px solid #282f42;
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
        }

        .profile-actions button {
            padding: 15px;
            background: #00f2fe;
            border: none;
            border-radius: 12px;
            color: #090a10;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .profile-actions button:hover {
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
        }

        /* Content Area */
        .content-area {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 30px;
            max-height: calc(100vh - 150px);
        }

        .output-box {
            background: #090a10;
            border: none;
            border-radius: 20px;
            padding: 30px;
            font-size: 16px;
            color: #e2e8f0;
            flex: 1;
            overflow-y: auto;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            padding: 15px;
            border-radius: 16px;
            max-width: 80%;
        }

        .user-message {
            background: #11131b;
            align-self: flex-end;
            border: 1px solid #1c202e;
            color: #fff;
        }

        .ai-message {
            background: #171c28;
            align-self: flex-start;
            border: none;
            color: #fff;
        }

        /* Input Section */
        .input-section {
            background: #090a10;
            padding: 20px 30px;
            border-top: none;
            width: 100%;
            position: absolute;
            bottom: 0;
            left: 0;
        }

        .main-input-row {
            display: flex;
            gap: 15px;
            max-width: 800px;
            margin: 0 auto;
            background: #11131b;
            padding: 10px;
            border-radius: 30px;
        }

        .main-input-row input {
            flex: 1;
            padding: 15px;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 16px;
            outline: none;
        }

        .icon-btn {
            background: #1a1e29;
            border: none;
            border-radius: 50%;
            color: #00f2fe;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            transition: 0.3s;
        }

        .icon-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 242, 254, 0.4);
        }
    </style>
</head>
<body>

    <!-- Login Screen -->
    <div class="login-screen" id="loginScreen">
        <div class="login-card">
            <h2>Welcome to NovaAI</h2>
            <input type="text" id="username" placeholder="Username" />
            <input type="password" id="password" placeholder="Password" />
            <button class="login-btn" onclick="handleLogin()">Log In</button>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="main-content" id="mainContent">
        <div class="top-bar">
            <div class="new-chat-btn" onclick="location.reload()">New Chat</div>
            <div class="user-info">
                <span>User Profile</span>
                <div class="profile-icon" onclick="openModal()">👤</div>
            </div>
        </div>

        <!-- Modal -->
        <div class="modal" id="profileModal">
            <div class="modal-content">
                <span class="close-btn" onclick="closeModal()">&times;</span>
                
                <h3>Recent Activity</h3>
                <ul class="activity-list" id="activityList">
                    <li>No recent activity.</li>
                </ul>

                <h3>Manage Profile</h3>
                <div class="profile-actions">
                    <input type="text" id="usernameInput" placeholder="Enter new username" />
                    <button onclick="updateProfile()">Update Profile</button>
                    <button onclick="alert('Logged out!')" style="background: #1a1e29; color: #ff0000; border: 1px solid #ff0000;">Log Out</button>
                </div>
            </div>
        </div>

        <div class="content-area">
            <div class="output-box" id="outputBox"></div>
        </div>

        <div class="input-section">
            <div class="main-input-row">
                <button class="icon-btn" onclick="alert('Photo upload coming soon!')">+</button>
                <input type="text" id="userInput" placeholder="Ask anything..." onkeypress="handleKey(event)" />
                <button class="icon-btn" onclick="processAI()">➔</button>
            </div>
        </div>
    </div>

    <script>
        // Login function
        function handleLogin() {
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value.trim();

            if (username !== "" && password !== "") {
                document.getElementById("loginScreen").style.display = "none";
                document.getElementById("mainContent").style.display = "flex";
            } else {
                alert("Please enter both username and password.");
            }
        }

        // Modal functions
        function openModal() {
            document.getElementById("profileModal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("profileModal").style.display = "none";
        }

        // Profile update
        function updateProfile() {
            const username = document.getElementById("usernameInput").value.trim();
            if (username) {
                alert(`Username updated to: ${username}`);
                document.getElementById("usernameInput").value = "";
            } else {
                alert("Please enter a username.");
            }
        }

        // Activity logging
        function logActivity(activity) {
            const activityList = document.getElementById("activityList");
            const noActivity = activityList.querySelector("li");
            if (noActivity && noActivity.innerText === "No recent activity.") {
                activityList.innerHTML = "";
            }
            const li = document.createElement("li");
            li.innerText = activity;
            activityList.appendChild(li);
        }

        // Chat functions
        function handleKey(event) {
            if (event.key === 'Enter') processAI();
        }

        function processAI() {
            const inputVal = document.getElementById("userInput").value.trim();
            const outputBox = document.getElementById("outputBox");
            
            if (inputVal === "") return;

            const userMsgDiv = document.createElement("div");
            userMsgDiv.className = "message user-message";
            userMsgDiv.innerText = inputVal;
            outputBox.appendChild(userMsgDiv);

            // Log the activity
            logActivity(`Asked: "${inputVal}"`);

            document.getElementById("userInput").value = "";
            outputBox.scrollTop = outputBox.scrollHeight;

            setTimeout(() => {
                const lowerInput = inputVal.toLowerCase();
                let response = "";

                if (lowerInput.includes("who are you")) {
                    response = "I am NovaAI, your personal assistant capable of generating comprehensive solutions, code, and content tailored to your needs.";
                } else if (lowerInput.includes("what is ai") || lowerInput.includes("artificial intelligence")) {
                    response = "Artificial Intelligence (AI) refers to the simulation of human intelligence in machines programmed to think and learn like humans.";
                } else if (lowerInput.includes("code") || lowerInput.includes("generate")) {
                    response = "As a generative AI, I can generate code, draft content, and create various digital assets based on your specifications.";
                } else if (lowerInput.includes("intensity")) {
                    response = "Intensity generally refers to the measurable amount of a property, such as force, energy, or brightness, per unit of area or volume.";
                } else {
                    response = "As NovaAI, I can assist by generating comprehensive knowledge and tailored solutions for any topic you inquire about.";
                }

                const aiMsgDiv = document.createElement("div");
                aiMsgDiv.className = "message ai-message";
                aiMsgDiv.innerText = response;
                outputBox.appendChild(aiMsgDiv);

                outputBox.scrollTop = outputBox.scrollHeight;
            }, 500);
        }
    </script>
</body>
</html>
