<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaAI - Custom Interface</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0a0a16, #1a0f3a, #4a0072);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            position: relative;
            overflow: hidden;
        }

        .bg-text {
            position: absolute;
            font-size: 10rem;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.02);
            z-index: 0;
            user-select: none;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            letter-spacing: 10px;
        }

        .app-container {
            width: 100%;
            max-width: 900px;
            height: 95vh;
            padding: 20px;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 40px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7);
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
        }

        .top-row {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: 10px;
        }

        .profile-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            transition: 0.2s;
        }

        .profile-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #00f2fe;
        }

        .output-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 24px;
            font-size: 16px;
            color: #fff;
            flex: 1;
            overflow-y: auto;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            padding: 15px;
            border-radius: 16px;
            max-width: 80%;
        }

        .user-message {
            background: rgba(0, 242, 254, 0.1);
            align-self: flex-end;
            border: 1px solid rgba(0, 242, 254, 0.2);
            color: #fff;
        }

        .ai-message {
            background: rgba(255, 255, 255, 0.05);
            align-self: flex-start;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #00f2fe;
        }

        .input-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .main-input-row {
            display: flex;
            gap: 12px;
        }

        .main-input-row input {
            flex: 1;
            padding: 18px 22px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        .main-input-row input:focus {
            border-color: #00f2fe;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
        }

        .main-input-row button {
            padding: 0 30px;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            border: none;
            border-radius: 18px;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .main-input-row button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 242, 254, 0.4);
        }

        .checkbox-row {
            display: flex;
            justify-content: flex-start;
            padding-left: 10px;
            margin-bottom: 5px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #94a3b8;
            cursor: pointer;
        }

        .checkbox-label input[type="checkbox"] {
            appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.3);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .checkbox-label input[type="checkbox"]:checked {
            background: #00f2fe;
            border-color: #00f2fe;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
        }

        .checkbox-label input[type="checkbox"]:checked::after {
            content: '✓';
            color: #000;
            font-weight: bold;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="bg-text">NovaAI</div>

    <div class="app-container">
        <div class="glass-card">
            
            <div class="top-row">
                <button class="profile-btn" title="Account">👤</button>
            </div>

            <div class="output-box" id="outputBox">
                <div class="message ai-message">Hello! I am your secure digital assistant. How can I help you today?</div>
            </div>

            <div class="input-section">
                
                <div class="checkbox-row">
                    <label class="checkbox-label">
                        <input type="checkbox" checked> Active
                    </label>
                </div>
                <div class="main-input-row">
                    <input type="text" id="userInput" placeholder="Ask me anything..." />
                    <button onclick="processAI()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function processAI() {
            const inputVal = document.getElementById("userInput").value.trim();
            const outputBox = document.getElementById("outputBox");
            
            if (inputVal === "") return;

            const userMsgDiv = document.createElement("div");
            userMsgDiv.className = "message user-message";
            userMsgDiv.innerText = inputVal;
            outputBox.appendChild(userMsgDiv);

            document.getElementById("userInput").value = "";
            outputBox.scrollTop = outputBox.scrollHeight;

            setTimeout(() => {
                let response = "";
                const lowerInput = inputVal.toLowerCase();

                if (lowerInput.includes("what is ai") || lowerInput.includes("artificial intelligence")) {
                    response = "Artificial Intelligence (AI) refers to the simulation of human intelligence in machines programmed to think and learn like humans. It involves tasks like problem-solving, reasoning, and learning.";
                } else if (lowerInput.includes("code") || lowerInput.includes("generate")) {
                    response = "As a generative AI, I can generate code, draft content, and create various digital assets based on your specifications.";
                } else {
                    response = "I can assist by generating comprehensive solutions, code, and content tailored to your needs.";
                }

                const aiMsgDiv = document.createElement("div");
                aiMsgDiv.className = "message ai-message";
                aiMsgDiv.innerText = response;
                outputBox.appendChild(aiMsgDiv);

                outputBox.scrollTop = outputBox.scrollHeight;
            }, 500);
        }
    </script>

</body>
</html>
